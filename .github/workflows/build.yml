name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 引擎二进制 111 MB 不入库，每个 job 自行拉取（有缓存）
  ENGINE_ARCH_SCRIPT: scripts/fetch_engine.py
  ENGINE_VERSION: v4.2.9

jobs:
  # ---------------------------------------------------------------
  # 测试：三个平台都跑。
  # 单测里有大量路径/文件锁相关逻辑（Windows 的 EBUSY、会话目录清理），
  # 只在 Linux 上跑会漏掉真实平台的差异。
  # ---------------------------------------------------------------
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 必须显式装 Python：Windows runner 上 `python3` 可能解析到 Microsoft Store
      # 的占位程序，`command -v python3` 能查到但一运行就失败。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 缓存引擎
        uses: actions/cache@v4
        with:
          path: resources/sidecar
          key: engine-${{ env.ENGINE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      # 拿不到引擎就跳过依赖引擎的用例（测试会 skip 并计数），
      # 不要把整条测试判红 —— 但日志里要能看见。
      - name: 拉取引擎
        continue-on-error: true
        shell: bash
        run: |
          if ls resources/sidecar/*/openlist* >/dev/null 2>&1; then
            echo "缓存命中，跳过下载"; exit 0
          fi
          for i in 1 2 3; do
            python "$ENGINE_ARCH_SCRIPT" && exit 0
            echo "第 $i 次失败，10 秒后重试"; sleep 10
          done
          exit 1

      - name: 引擎是否就绪
        shell: bash
        run: |
          if ls resources/sidecar/*/openlist* >/dev/null 2>&1; then
            echo "引擎已就绪，依赖引擎的用例将会执行"
          else
            echo "::warning::未取到引擎，依赖引擎的用例会被跳过"
          fi

      - name: 运行测试
        shell: bash
        run: node --test --test-force-exit "test/**/*.test.ts"

      # 把已下载的引擎作为 artifact 传给打包阶段。
      # 打包 job 里从 GitHub Releases 重新下载在 Windows runner 上连续失败，
      # 而同一份文件在 test job 里是下得下来的 —— 用 artifact 传过去最稳。
      #
      # 这里刻意不用 `if: hashFiles(...)` 做门控：hashFiles 在 step 级 if 里的
      # 求值时机不可靠，一旦判空就等于从没上传过，打包 job 也就无从取回。
      # 目录不存在时由 if-no-files-found: ignore 兜底即可。
      - name: 上传引擎（供打包复用）
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ runner.os }}
          path: resources/sidecar
          retention-days: 1
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # 打包：每个平台各出安装包。
  #
  # 关于 macOS：不再使用 macos-13(Intel) —— 那个 runner 极度稀缺，
  # 实测排队 30 分钟以上仍未分配，会把整个 run 卡在 queued。
  # 改为在 macos-latest(arm64) 上一次性跨架构产出 x64 + arm64 两个 dmg，
  # 这也是 electron-builder.yml 里移除 electronDist 的原因。
  # ---------------------------------------------------------------
  package:
    name: package / ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            flag: --win --x64
            artifacts: release/*.exe
          - os: macos-latest
            label: macos
            flag: --mac --x64 --arm64
            artifacts: release/*.dmg
          - os: ubuntu-latest
            label: linux-x64
            flag: --linux --x64
            artifacts: |
              release/*.AppImage
              release/*.deb
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # electron-builder 会从 GitHub 下载 NSIS / 7zip / fpm 等工具，
      # 直连偶发 ECONNRESET。缓存下来避免每次重下，重试兜住抖动。
      - name: 缓存 electron-builder 工具
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron-builder
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron-builder
          key: eb-tools-${{ runner.os }}-${{ hashFiles('electron-builder.yml') }}

      - name: 缓存引擎
        uses: actions/cache@v4
        with:
          path: resources/sidecar
          key: engine-${{ env.ENGINE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      # 优先复用测试阶段下载好的引擎（同一次 run 内的 artifact，稳定）。
      #
      # 刻意先解到暂存目录再「搜出来归位」，而不是直接解到 resources/sidecar：
      # upload-artifact v4 保留的是相对工作区的路径，直接解到目标目录会变成
      # resources/sidecar/resources/sidecar/... 这样多一层，导致后面找不到二进制
      # （实测就卡在这里：artifact 取回成功，但 ls resources/sidecar/*/openlist* 落空）。
      - name: 取回测试阶段的引擎
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: engine-${{ runner.os }}
          path: engine-dl

      - name: 归位引擎
        shell: bash
        run: |
          found="$(find engine-dl -type f \( -name 'openlist' -o -name 'openlist.exe' \) 2>/dev/null | head -1 || true)"
          if [ -z "$found" ]; then
            echo "暂存目录里没有引擎，交给下一步重新下载"
            exit 0
          fi
          sub="$(basename "$(dirname "$found")")"
          echo "找到 $found -> resources/sidecar/$sub/"
          mkdir -p "resources/sidecar/$sub"
          cp -f "$found" "resources/sidecar/$sub/"
          chmod +x "resources/sidecar/$sub/"* 2>/dev/null || true
          ls -la "resources/sidecar/$sub"

      # 打包必须要有引擎：缺了会打出一个跑不起来的安装包，所以这一步不允许失败
      - name: 拉取引擎
        id: eng
        shell: bash
        run: |
          set -o pipefail   # 否则 `python | tee` 的退出码会被 tee 吞掉
          if ls resources/sidecar/*/openlist* >/dev/null 2>&1; then
            echo "已有引擎，跳过下载"; exit 0
          fi
          for i in 1 2 3 4 5; do
            echo "===== 第 $i 次尝试 =====" | tee -a fetch.log
            if python "$ENGINE_ARCH_SCRIPT" 2>&1 | tee -a fetch.log; then
              exit 0
            fi
            echo "第 $i 次失败，15 秒后重试"; sleep 15
          done
          exit 1

      # Actions 日志对匿名请求是 403，而要写 issue/commit comment 又需要写权限。
      # 这里把错误的关键片段塞进 artifact **名字** 里 —— artifact 列表是公开可读的，
      # 于是不需要任何额外权限也能从外部看到真实报错。
      - name: 采集错误摘要
        id: err
        if: failure() && steps.eng.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "--- python ---"; python -V 2>&1 || true
            echo "--- curl ---"; command -v curl || true
            echo "--- ls ---"; ls -la resources 2>&1 || true; ls -la resources/sidecar 2>&1 || true
            echo "--- log ---"; tail -c 3000 fetch.log 2>/dev/null || echo "(no fetch.log)"
          } > diag.txt 2>&1
          MSG="$(grep -viE '^\s*$' diag.txt | tail -c 400 | tr -d '\r' | tr '\n' ' ' \
                 | tr -cd 'A-Za-z0-9 .:_()\[\]{}=-|' | cut -c1-90)"
          echo "msg=${MSG:-unknown}" >> "$GITHUB_OUTPUT"

      - name: 上传诊断
        if: failure() && steps.eng.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ runner.os }}-${{ steps.err.outputs.msg }}
          path: diag.txt
          retention-days: 3
          if-no-files-found: ignore

      - name: 构建应用
        run: pnpm build

      - name: 打包
        shell: bash
        env:
          # 没有证书，跳过 macOS 签名探测（否则会因找不到证书而报错）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for i in 1 2 3; do
            if npx electron-builder ${{ matrix.flag }} --publish never; then
              exit 0
            fi
            echo "第 $i 次打包失败，15 秒后重试"
            sleep 15
          done
          echo "::error::打包连续 3 次失败"
          exit 1

      - name: 产物清单
        shell: bash
        run: ls -lh release || true

      - uses: actions/upload-artifact@v4
        with:
          name: panhub-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14
