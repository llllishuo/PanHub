appId: org.panhub.app
productName: PanHub
copyright: Copyright © 2026 llllishuo

directories:
  output: release
  buildResources: build

# 只把构建产物和清单打进 asar
files:
  - out/**/*
  - package.json
  - '!**/*.map'

asar: true
npmRebuild: false

# 复用 node_modules 里已解压好的 Electron，避免重新下载 200+ MB。
# 注意：这也意味着**只能打宿主架构的包**——跨架构要换对应 runner。
electronDist: node_modules/electron/dist

# 引擎二进制 111 MB，必须放在 asar 之外。
# CI 里每个 runner 只会拉取自己平台的引擎目录，因此这里整目录拷进去即可，
# 不用去对齐 electron-builder 的 ${os}/${arch} 宏与 Node 的
# process.platform/arch 命名差异（win vs win32、x64 vs amd64）——
# 主进程会自己按已知命名 + 目录扫描来定位二进制。
extraResources:
  - from: resources/sidecar
    to: sidecar

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-x64.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false

mac:
  # 不写死 arch：由 CI 的 runner 决定（macos-13 → x64，macos-14 → arm64）。
  # 写死 [x64, arm64] 会去做跨架构打包，而 electronDist 指向本地解压的
  # Electron 只有宿主架构，必然失败。
  target:
    - target: dmg
  category: public.app-category.utilities
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Utility
  # deb 目标强制要求 maintainer；package.json 里虽已有 author，
  # 这里显式写死一份，避免因为 author 结构变化而让 linux 打包突然失败。
  maintainer: llllishuo <1756524586@qq.com>
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
